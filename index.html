<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>পূজা কোথায় দেখব</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@600&family=Tiro+Bangla&display=swap">
<style>
/* Layout concept: one night-lit page. Header with language slider and three tabs (Durga, Kali, 2026 calendar), a countdown, then list and schematic map side by side on wide screens. Kali groups puja by area with a count; the calendar is a vertical timeline. */
:root{
  --bg:#0D0E1E; --surface:#161830; --surface2:#1D2040; --line:#2C2F52;
  --fg:#F7ECD6; --muted:#A8A6BF; --accent:#F4A83D; --accent-ink:#1A1204;
  --sindoor:#E0452E; --glow:rgba(244,168,61,.38); --river:#232C58; --focus:#FFD68A;
  --stripe:linear-gradient(90deg,transparent,var(--accent),transparent);
  --font-display:'Tiro Bangla','Hind Siliguri',Georgia,serif;
  --font-body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-fest="durga"]{
  --bg:#FFFCF7; --surface:#FFFFFF; --surface2:#F8EFE3; --line:#EAD9C6;
  --fg:#2B1912; --muted:#7B6558; --accent:#C42B1E; --accent-ink:#FFFFFF;
  --sindoor:#C42B1E; --glow:rgba(196,43,30,.16); --river:#DDE8F0; --focus:#C42B1E;
  --stripe:linear-gradient(var(--sindoor) 0 4px,transparent 4px 6px,#C9A24A 6px 8px);
  color-scheme:light;
}
/* Festival calendar: a third look, misty sage with peacock teal */
:root[data-fest="cal"]{
  --bg:#EDF3F0; --surface:#FFFFFF; --surface2:#E2ECE8; --line:#CBDAD4;
  --fg:#17302B; --muted:#5E7770; --accent:#0E7C73; --accent-ink:#FFFFFF;
  --sindoor:#C2452D; --glow:rgba(14,124,115,.18); --river:#D3E3DD; --focus:#0E7C73;
  --stripe:linear-gradient(var(--accent) 0 4px,transparent 4px 6px,#8FBFB5 6px 8px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .5s,color .5s;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stripe{height:8px;background:var(--stripe);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand svg{width:30px;height:34px;flex:none}
.brand b{font-family:var(--font-display);font-weight:400;font-size:1.55rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.lang{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;width:124px}
.lang .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:999px;transition:transform .3s}
.lang[data-lang="en"] .thumb{transform:translateX(100%)}
.lang button{position:relative;background:none;border:0;padding:5px 0;font-weight:600;font-size:.9rem;color:var(--muted);transition:color .3s}
.lang button[aria-pressed="true"]{color:var(--accent-ink)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;background:none;border:0;border-radius:10px;padding:8px 4px;font-weight:600;font-size:.92rem;line-height:1.25;color:var(--muted);transition:background .25s,color .25s}
.tabs button:hover{color:var(--fg)}
.tabs button .lb{text-align:center}
.tabs button svg{width:22px;height:22px;flex:none}
.tabs .om{font-family:'Noto Sans Devanagari','Hind Siliguri',sans-serif;font-size:1.35rem;line-height:22px;height:22px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media(min-width:560px){.tabs button{flex-direction:row;gap:10px;padding:10px 12px;font-size:1rem}}

/* countdown */
.count{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;overflow:hidden}
.count::before{content:"";position:absolute;inset:-35% auto auto 20%;width:60%;height:120%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.count>*{position:relative;min-width:0}
.big{font-family:var(--font-display);font-size:4.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .lbl{font-size:1.1rem;font-weight:600}
.count .sub{color:var(--muted);font-size:.92rem}
.diyas{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.diya{width:20px;height:23px}
.diya .flame{opacity:0;transform-origin:50% 100%;transform-box:fill-box}
.diya .bowl{fill:var(--line)}
.diya .wick{fill:var(--muted)}
.diya.lit .bowl{fill:#B5651D}
.diya .fg{transform-origin:50% 100%;transform-box:fill-box}
.diya.lit .flame{fill:var(--accent);animation:seqlit 12s ease-out infinite both;animation-delay:calc(var(--i)*.45s)}
.diya.lit .fg{animation:flick 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.3s)}
@keyframes seqlit{0%{opacity:0;transform:scale(0)}3%{opacity:1;transform:scale(1.3)}6%,88%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(.3)}}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.9,1.08)}70%{transform:scale(1.05,.94)}}
.days{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.days span{border:1px solid #E5B4AE;background:#FBEDEB;border:1px solid color-mix(in srgb,var(--sindoor) 35%,transparent);background:color-mix(in srgb,var(--sindoor) 9%,transparent);border-radius:999px;padding:2px 14px;font-size:.9rem;font-weight:600;color:var(--sindoor)}
.cd-label{font-family:var(--font-display);font-size:1.35rem;line-height:1.3}
.cd-date{color:var(--muted);font-size:.92rem;margin-top:-6px}
.cdx{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cd-days{display:flex;align-items:baseline;justify-content:center;gap:10px}
.cd-days b{font-family:var(--font-display);font-weight:400;font-size:clamp(4rem,20vw,5.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cd-days span{font-size:1.1rem;font-weight:600}
.cd-hms{display:flex;align-items:center;justify-content:center;gap:8px}
.cd-hms div{display:flex;flex-direction:column;align-items:center;min-width:3.4rem}
.cd-hms b{font-family:var(--font-display);font-weight:400;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cd-hms small{font-size:.74rem;color:var(--muted)}
.cd-hms i{font-style:normal;font-size:1.6rem;color:var(--muted);align-self:flex-start;line-height:1.1;animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{opacity:.2}}
.cd-bar{width:100%;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.cd-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width 1s linear}
.cd-note{color:var(--muted);font-size:.84rem;max-width:520px}

/* controls */
.controls{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.controls{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.inrow{display:flex;gap:8px;min-width:0}
.inp{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.inp::placeholder{color:var(--muted)}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:.82rem;color:var(--muted);min-height:1.3em}

/* kali kind chips */
.kinds{display:flex;flex-direction:column;gap:6px}
.kinds .row{display:flex;gap:8px;flex-wrap:wrap}
.pillbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600;font-size:.94rem}
.pillbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pillbtn small{opacity:.8;font-weight:500;margin-left:4px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .cnt{color:var(--muted);font-size:.92rem}
.viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewtoggle button{background:var(--surface);border:0;padding:6px 16px;font-weight:600}
.viewtoggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media(min-width:900px){.viewtoggle{display:none}}

/* main grid */
.main{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.mapcol{position:sticky;top:16px}}
@media(max-width:899px){.wrap[data-view="list"] .mapcol{display:none}.wrap[data-view="map"] .listcol{display:none}}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sec{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.05rem;color:var(--accent);margin-top:8px}
.sec::after{content:"";flex:1;border-top:1px dashed var(--line)}
.sec:first-child{margin-top:0}
.card{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 6px 22px var(--glow)}
.c-name{display:block;font-family:var(--font-display);font-size:1.18rem;line-height:1.25}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:.86rem;margin-top:2px}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.78rem}
.chip.warn{border-color:var(--sindoor);color:var(--sindoor)}
.c-dist{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap;text-align:right}
.c-dist small{display:block;color:var(--muted);font-weight:400;font-size:.72rem}
.gnum{font-family:var(--font-display);font-size:1.9rem;line-height:1;color:var(--accent);font-weight:400;display:block}
.detail{margin:-4px 0 0;padding:12px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.detail .k{color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.02em}
.detail a{color:var(--accent);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copyfb{width:100%;font-size:.82rem}
.gbody{margin:-4px 0 4px;padding:12px;border:1px solid var(--accent);border-top:0;border-radius:0 0 12px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.gbody .list{gap:6px}
.sub-h{font-size:.84rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.sub-h::after{content:"";flex:1;border-top:1px dashed var(--line)}
.emptybox{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapnote{padding:8px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.pin{cursor:pointer}
.pin:focus-visible{outline:none}
.pin:focus-visible circle.core{stroke:var(--focus);stroke-width:3}
.ghost{fill:var(--muted);opacity:.55;font-size:11px;text-anchor:middle}
.plabel{fill:var(--fg);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.pcount{fill:var(--accent-ink);font-size:11px;font-weight:700;text-anchor:middle}

/* calendar timeline */
.calhead{display:flex;flex-direction:column;gap:6px}
.calhead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.calhead .sum{color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:0}
.tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;border-left:2px dashed var(--line)}

.tl li{position:relative;display:flex;align-items:center;gap:12px;margin-left:34px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl li.empty{display:block;margin-left:34px}
.tl .dot{position:absolute;left:-31px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--accent-ink)}
.tl li.done .tb,.tl li.done .fw{opacity:.7}
.tl li.done .dot{background:#9BA8A3;border-color:#9BA8A3;color:#fff}
.tl li.done .status{color:var(--muted);border-color:var(--line)}
.tl .tb{flex:1;min-width:0}
.tl .fw{width:40px;height:40px;flex:none}
.tl .fi{width:40px;height:40px}
.upnext{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 20px}
.un-k{display:flex;align-items:center;gap:12px;width:100%;max-width:340px;font-size:.82rem;font-weight:700;letter-spacing:.16em;color:var(--accent)}
.un-k::before,.un-k::after{content:"";flex:1;height:1px;background:var(--line)}
.un-stage{position:relative;width:124px;height:124px;display:grid;place-items:center;margin:4px 0}
.un-stage::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);animation:halo 3s ease-in-out infinite}
.un-stage .fi{position:relative;width:92px;height:92px;overflow:visible;animation:floaty 3.4s ease-in-out infinite}
.un-stage .sp{position:absolute;left:50%;bottom:34%;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0;animation:spark 3s ease-out infinite}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--x),-64px) scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.un-name{font-family:var(--font-display);font-size:1.9rem;line-height:1.25}
.un-date{color:var(--muted);font-size:1rem}
.un-pill{margin-top:4px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 18px;font-weight:700;font-size:.95rem}
.fi{display:block;--ic:#E5951A;--icg:rgba(229,149,26,.3)}
.fi .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.fi .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:.75;transform:scale(1.08)}}
.fi .sway{transform-origin:20px 30px;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.fi .note{opacity:0;animation:noteup 2.4s ease-out infinite}
.fi .note.n2{animation-delay:1.2s}
@keyframes noteup{0%{opacity:0;transform:translateY(4px)}25%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
.fi .lot{transform-origin:20px 30px;animation:lotus 3s ease-in-out infinite}
@keyframes lotus{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
.fi .splat{opacity:0;transform-box:fill-box;transform-origin:center;animation:splat 2.4s ease-out infinite}
.fi .splat.s2{animation-delay:.4s}.fi .splat.s3{animation-delay:.8s}.fi .splat.s4{animation-delay:1.2s}.fi .splat.s5{animation-delay:1.6s}
@keyframes splat{0%{opacity:0;transform:scale(.1)}28%{opacity:.95;transform:scale(1.15)}100%{opacity:0;transform:scale(1.7)}}
.fi-holi{overflow:visible}
.fi .drop{opacity:0;transform-box:fill-box;transform-origin:center;animation:fly 2.4s ease-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.3)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.fi .fg{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite}
.fi .cflame{transform-box:fill-box;transform-origin:50% 100%;animation:cflame 5.5s ease-in-out infinite both}
@keyframes cflame{0%{opacity:0;transform:scale(0)}12%{opacity:1;transform:scale(1.3)}18%{transform:scale(1)}62%{opacity:1;transform:scale(1)}70%{opacity:.7;transform:scale(.55,.7)}75%{opacity:1;transform:scale(.8)}80%,100%{opacity:0;transform:scale(0)}}
.fi .cglow{opacity:0;animation:cglow 5.5s ease-in-out infinite}
@keyframes cglow{0%{opacity:0}15%,62%{opacity:1}80%,100%{opacity:0}}
.fi .csmoke{opacity:0;animation:csmoke 5.5s ease-out infinite}
@keyframes csmoke{0%,76%{opacity:0;transform:translateY(0)}82%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
.emb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.emb iframe{display:block;width:100%;height:220px;border:0}
.foot span+span{text-align:right}
.fi .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fi .bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.fi .ray{animation:ray 2s ease-in-out infinite}
@keyframes ray{0%,100%{opacity:.3}50%{opacity:1}}
.fi .stick{animation:beat .7s ease-in-out infinite}
.fi .stick.s2{animation-name:beat2;animation-delay:.35s}
@keyframes beat{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes beat2{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.fi .wave{opacity:0;animation:wave 1.4s ease-out infinite}
.fi .wave.w2{animation-delay:.45s}
@keyframes wave{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.fi .orbit{transform-origin:20px 20px;animation:spin 8s linear infinite}
.fi .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.fi .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.tl li.live .dot,.tl li.next .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--glow)}
.tl li.next .tl-name,.tl li.live .tl-name{color:var(--accent)}
.tl-name{font-family:var(--font-display);font-size:1.15rem;line-height:1.3}
.tl-date{color:var(--muted);font-size:.88rem}
.status{white-space:nowrap;font-size:.84rem;font-weight:700;border-radius:999px;padding:2px 12px;border:1px solid var(--line);color:var(--muted)}
.tl li.live .status,.tl li.next .status{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl li.left .status{color:var(--fg)}
.tag-next{display:inline-block;margin-left:8px;font-family:var(--font-body);font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.calnote{color:var(--muted);font-size:.84rem}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.84rem;border-top:1px solid var(--line);padding-top:14px}

/* add sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0}
.sheet[hidden]{display:none}
.sheet form{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
@media(min-width:700px){.sheet{align-items:center}.sheet form{border-radius:18px}}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 24px var(--glow),0 2px 8px rgba(0,0,0,.35)}
.fab[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:40;max-width:90%}
.toast[hidden]{display:none}

/* opening splash */
.splash{position:fixed;inset:0;z-index:100;background:#080914;color:#F7ECD6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .6s}
.splash[hidden]{display:none}
.splash.out{opacity:0;pointer-events:none}
.splash .glow{position:absolute;width:90vmin;height:90vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(244,168,61,.5),transparent);transform:scale(.1);opacity:0;animation:bloom 2.4s .5s ease-out forwards}
.splash.durga .glow{background:radial-gradient(closest-side,rgba(224,69,46,.35),transparent)}
@keyframes bloom{to{transform:scale(1);opacity:1}}
.splash svg{position:relative;width:110px;height:auto}
.splash .sflame{transform-origin:50% 100%;transform-box:fill-box;transform:scale(0);animation:ignite .9s 1.1s ease-out forwards,flick 1.6s 2s ease-in-out infinite}
@keyframes ignite{to{transform:scale(1)}}
.splash h1{position:relative;margin:0;font-family:var(--font-display);font-weight:400;font-size:2.2rem;opacity:0;animation:rise .8s 1.5s ease-out forwards}
.splash p{position:relative;margin:0;color:#B9B6CE;opacity:0;animation:rise .8s 1.9s ease-out forwards}
.splash .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:.82rem;color:#7F7C99}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.smoke circle{fill:#d9d4e6;opacity:0;animation:smoke 3.2s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:.9s}.smoke circle:nth-child(3){animation-delay:1.8s}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:.5}100%{opacity:0;transform:translate(10px,-70px) scale(2.4)}}
.ember{animation:ember 1.4s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.7}50%{opacity:1}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .splash .sflame{transform:scale(1)}
  .splash .glow{transform:scale(1);opacity:1}
  .splash h1,.splash p{opacity:1}
  .diya.lit .flame{opacity:1!important;transform:none!important}
}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
</style>
</head>

var TARGETS={kali:Date.parse('2026-11-08T00:00:00+06:00'),durga:Date.parse('2027-10-04T00:00:00+06:00')};
var TOTAL_DIYAS=13;

function p2(x){return n(x<10?'0'+x:x)}

var WINDOW={kali:30*864e5,durga:365*864e5};

 +'<div class="cd-hms"><div><b data-u="h">'+p2(p.h)+'</b><small>'+t.uH+'</small></div><i>:</i><div><b data-u="m">'+p2(p.m)+'</b><small>'+t.uM+'</small></div><i>:</i><div><b data-u="s">'+p2(p.s)+'</b><small>'+t.uS+'</small></div></div>'
 +'<div class="cd-bar"><i id="cdbar" style="width:'+pct(ms).toFixed(1)+'%"></i></div></div>'}
function renderCount(){

 if(st.fest==='kali'){
  st.lit=litCount(ms);var row='';
  for(var i=0;i<TOTAL_DIYAS;i++)row+=diyaSvg(i<st.lit,i);
  if(!ended)html='<div class="cd-label">'+t.kali+'</div><div class="cd-date">'+t.kaliDate+'</div>'+cdHTML(p,ms)+'<div class="diyas">'+row+'</div>';
  else html='<div class="cd-label">'+(Date.now()<TARGETS.kali+864e5?t.kaliToday:t.kaliOver)+'</div><div class="diyas">'+row+'</div>';
 }else{
  var NAV=[2027,9,8],chips=t.dd.map(function(x){return '<span>'+x+'</span>'}).join('');
  if(!ended)html='<div class="cd-label">'+t.d27+'</div><div class="cd-date">'+t.d27r+'</div>'+cdHTML(p,ms)+'<div class="days">'+chips+'</div>';

 if((ms<=0)!==st.cdEnded){renderCount();return}
 if(ms<=0)return;
 var p=split(ms),el=$('cd');if(!el)return;
 var vals={d:n(p.d),h:p2(p.h),m:p2(p.m),s:p2(p.s)};
 [].forEach.call(el.querySelectorAll('b[data-u]'),function(b){var v=vals[b.dataset.u];if(b.textContent!==v)b.textContent=v});

   if(gr.k===selKey){
    var lp=labelPos(x);
    selHTML='<g class="pin" tabindex="0" role="button" data-area="'+gr.k+'" aria-label="'+esc(nameOf(a))+'"><circle cx="'+x+'" cy="'+y+'" r="22" fill="var(--glow)"/><circle class="core" cx="'+x+'" cy="'+y+'" r="12" fill="var(--accent)" stroke="var(--fg)" stroke-width="2.5"/><text class="pcount" x="'+x+'" y="'+(y+4)+'">'+n(tot)+'</text></g><text class="plabel" x="'+lp.lx+'" y="'+(y-20)+'" text-anchor="'+lp.anc+'">'+esc(nameOf(a))+'</text>'}
   else pinsHTML+='<g class="pin" tabindex="0" role="button" data-area="'+gr.k+'" aria-label="'+esc(nameOf(a))+'"><circle cx="'+x+'" cy="'+y+'" r="15" fill="var(--glow)"/><circle class="core" cx="'+x+'" cy="'+y+'" r="9" fill="var(--accent)" stroke="var(--surface2)" stroke-width="2"/><text class="pcount" x="'+x+'" y="'+(y+3.5)+'">'+n(tot)+'</text></g>'});
  if(st.user&&selKey){var a3=AREA[selKey];s+='<line x1="'+px(st.user.lng)+'" y1="'+py(st.user.lat)+'" x2="'+px(a3.lng)+'" y2="'+py(a3.lat)+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/><text class="plabel" x="'+((px(st.user.lng)+px(a3.lng))/2)+'" y="'+((py(st.user.lat)+py(a3.lat))/2-6)+'" text-anchor="middle">'+km(distArea(selKey))+' '+t.km+'</text>'}
 }else{
  var arr=visible(),sel=null;arr.forEach(function(p){if(p.id===st.sel)sel=p});
  if(st.user&&sel){var a=AREA[sel.a];s+='<line x1="'+px(st.user.lng)+'" y1="'+py(st.user.lat)+'" x2="'+px(a.lng)+'" y2="'+py(a.lat)+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/><text class="plabel" x="'+((px(st.user.lng)+px(a.lng))/2)+'" y="'+((py(st.user.lat)+py(a.lat))/2-6)+'" text-anchor="middle">'+km(dist(sel))+' '+t.km+'</text>'}
  arr.forEach(function(p){if(p.id===st.sel)return;var a=AREA[p.a],x=px(a.lng),y=py(a.lat);
   pinsHTML+='<g class="pin" tabindex="0" role="button" data-id="'+esc(p.id)+'" aria-label="'+esc(nameOf(p))+'"><circle cx="'+x+'" cy="'+y+'" r="13" fill="var(--glow)"/><circle class="core" cx="'+x+'" cy="'+y+'" r="6.5" fill="var(--accent)" stroke="var(--surface2)" stroke-width="2"/></g>'});
  if(sel){var a2=AREA[sel.a],xs=px(a2.lng),ys=py(a2.lat),lp2=labelPos(xs);
   selHTML='<g class="pin" tabindex="0" role="button" data-id="'+esc(sel.id)+'" aria-label="'+esc(nameOf(sel))+'"><circle cx="'+xs+'" cy="'+ys+'" r="20" fill="var(--glow)"/><circle class="core" cx="'+xs+'" cy="'+ys+'" r="9.5" fill="var(--accent)" stroke="var(--fg)" stroke-width="2.5"/></g><text class="plabel" x="'+lp2.lx+'" y="'+(ys-17)+'" text-anchor="'+lp2.anc+'">'+esc(nameOf(sel))+'</text>'}
 }
 s+=pinsHTML+selHTML;
 if(st.user){var xu=px(st.user.lng),yu=py(st.user.lat);
  s+='<g><circle cx="'+xu+'" cy="'+yu+'" r="10" fill="none" stroke="var(--fg)" stroke-width="2" opacity=".6"/><circle cx="'+xu+'" cy="'+yu+'" r="5" fill="var(--fg)"/><text class="plabel" x="'+(xu+12)+'" y="'+(yu+4)+'">'+t.you+'</text></g>'}
 s+='</svg>';
 $('map').innerHTML=s;$('mapNote').textContent=t.mapNote}

function calStatus(c){
 var e=c.e||c.s,ds=dayDiff(c.s),de=dayDiff(e);
 if(de<0)return{k:'done'};
 if(ds<=0&&de>=0)return{k:'live',today:ds===0&&de===0};
 return{k:'left',d:ds}}
function statusText(s){var t=T();if(s.k==='done')return t.done;if(s.k==='live')return s.today?t.todayL:t.liveNow;return t.left(s.d)}
var TICK_SVG='<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 5.2L4.2 7.4L8 2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SP='';[[-30,0],[22,.5],[-12,1],[34,1.5],[-38,2],[8,2.4]].forEach(function(a){SP+='<i class="sp" style="--x:'+a[0]+'px;animation-delay:'+a[1]+'s"></i>'});
function upDate(c){var d=new Date(c.s[0],c.s[1],c.s[2]),o=WD[st.lang][d.getDay()]+', '+n(c.s[2])+' '+MON[st.lang][c.s[1]];if(c.e)o+=' – '+n(c.e[2])+' '+MON[st.lang][c.e[1]];return o}
function renderCal(){
 var t=T(),items=CAL.map(function(c){return{c:c,s:calStatus(c)}});
 var nd=items.filter(function(i){return i.s.k==='done'}).length,nl=items.length-nd;
 var next=null;items.forEach(function(i){if(!next&&i.s.k!=='done')next=i});
 $('calTitle').textContent=t.calTitle;
 $('upnext').innerHTML='<div class="upnext"><div class="un-k">'+t.upLabel+'</div>'+(next?'<div class="un-stage">'+festIcon(next.c.k)+SP+'</div><div class="un-name">'+esc(nameOf(next.c))+'</div><div class="un-date">'+upDate(next.c)+'</div><div class="un-pill">'+(next.s.k==='left'?t.upIn(next.s.d):statusText(next.s))+'</div>':'<div class="un-name">'+t.yearEnd+'</div>')+'</div>';
 var out='';
 items.forEach(function(i){
  var k=i.s.k,cls=k==='left'?(i===next?'next':'left'):k;
  out+='<li class="'+cls+'"><span class="dot">'+(k==='done'?TICK_SVG:'')+'</span><span class="fw">'+festIcon(i.c.k)+'</span><div class="tb"><div class="tl-name">'+esc(nameOf(i.c))+'</div><div class="tl-date">'+fmtRange(i.c.s,i.c.e)+'</div></div><span class="status">'+statusText(i.s)+'</span></li>'});
 $('tl').innerHTML=out;
 }

function fillTypes(){
 var t=T(),types=st.fest==='kali'?['sangha','para']:['sarbojanin','sangha'];
 $('fType').innerHTML=types.map(function(k){return '<option value="'+k+'">'+t.types[k]+'</option>'}).join('')}
function renderStatic(){
 var t=T();document.documentElement.lang=st.lang==='bn'?'bn':'en';
 document.documentElement.dataset.fest=st.fest;
 $('appName').textContent=t.name;$('appTag').textContent=t.tag;
 [].forEach.call($('tabs').children,function(b){b.innerHTML=tabIcon(b.dataset.f)+'<span class="lb">'+t[b.dataset.f]+'</span>';b.setAttribute('aria-pressed',b.dataset.f===st.fest)});
 var lg=$('lang');lg.dataset.lang=st.lang;[].forEach.call(lg.querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',b.dataset.l===st.lang)});
 $('lSearch').textContent=t.search;$('search').placeholder=t.searchPh;
 $('lWhere').textContent=t.where;$('where').placeholder=t.wherePh;$('live').textContent=t.live;
 var wh=$('where');if(st.user&&st.user.k)wh.value=nameOf(AREA[st.user.k]);
 $('areaList').innerHTML=AREAS.map(function(a){return '<option value="'+esc(nameOf(a))+'"></option>'}).join('');
 $('whereHint').textContent=st.user&&st.user.example?t.exHint:'';
 var vt=$('viewtoggle').children;vt[0].textContent=t.list;vt[1].textContent=t.map;
 $('demoNote').textContent=t.dev;$('geoNote').textContent=t.geo;$('fab').textContent=st.fest==='kali'?t.addMandap:t.add;
 $('fTitle').textContent=t.fTitle;$('lfName').textContent=t.fName;$('lfArea').textContent=t.fArea;$('lfAddr').textContent=t.fAddr;$('lfType').textContent=t.fType;
 $('lfLink').textContent=t.fLink;$('fLinkHint').textContent=t.fLinkHint;
 $('fNote').textContent=t.fNote;$('fCancel').textContent=t.cancel;$('fSubmit').textContent=t.submit;
 var cur=$('fArea').value;
 $('fArea').innerHTML=AREAS.filter(function(a){return !(st.fest==='kali'&&TO(a.k))}).map(function(a){return '<option value="'+a.k+'">'+esc(nameOf(a))+'</option>'}).join('');
 if(cur)$('fArea').value=cur;
 fillTypes();
 var isCal=st.fest==='cal';$('pujaArea').hidden=isCal;$('calArea').hidden=!isCal;$('fab').hidden=isCal}
function renderAll(){renderStatic();renderCount();renderKinds();if(st.fest==='cal'){renderCal()}else{renderList();renderMap()}}

/* ---------- copy ---------- */
function copyText(text,btn){
 var fail=function(){
  toast(T().copyFail);
  var host=btn&&btn.parentNode;if(!host||host.querySelector('.copyfb'))return;
  var i=document.createElement('input');i.className='inp copyfb';i.readOnly=true;i.value=text;host.appendChild(i);i.focus();i.select()};
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(T().copied)},fail)}
  else fail()
 }catch(e){fail()}}

/* ---------- events ---------- */
$('lang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.lang=b.dataset.l;try{localStorage.setItem('pkd_lang',st.lang)}catch(x){}renderAll()});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.fest=b.dataset.f;st.sel=null;st.selArea=null;st.kind='all';st.q='';$('search').value='';renderAll()});
$('kinds').addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b)return;st.kind=b.dataset.k;st.sel=null;renderKinds();renderList();renderMap()});
$('search').addEventListener('input',function(e){st.q=e.target.value;renderList();renderMap()});
function pick(id){st.sel=st.sel===id?null:id;
 if(st.sel===null){renderList();renderMap();return}
 renderList();renderMap()}
function pickArea(k){st.selArea=k;st.sel=null;renderList();renderMap()}
$('list').addEventListener('click',function(e){
 var cp=e.target.closest('button[data-copy]');
 if(cp){var p=all().filter(function(x){return x.id===cp.dataset.copy})[0];if(p)copyText(mapsLink(p),cp);return}
 var ad=e.target.closest('button[data-addarea]');
 if(ad){openSheet(ad.dataset.addarea);return}
 var ga=e.target.closest('button[data-area]');if(ga){pickArea(ga.dataset.area);return}
 var b=e.target.closest('.card');if(b&&b.dataset.id)pick(b.dataset.id)});
$('map').addEventListener('click',function(e){var g=e.target.closest('.pin');if(!g)return;if(g.dataset.area)pickArea(g.dataset.area);else st.sel=g.dataset.id,renderList(),renderMap()});
$('map').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var g=e.target.closest('.pin');if(g){e.preventDefault();if(g.dataset.area)pickArea(g.dataset.area);else st.sel=g.dataset.id,renderList(),renderMap()}}});
$('viewtoggle').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.view=b.dataset.v;$('wrap').dataset.view=st.view;
 [].forEach.call($('viewtoggle').children,function(x){x.setAttribute('aria-pressed',x.dataset.v===st.view)})});
$('where').addEventListener('input',function(e){
 var v=e.target.value.trim().toLowerCase();if(!v){st.user=null;$('whereHint').textContent='';renderList();renderMap();return}
 var m=AREAS.filter(function(a){return a.bn.toLowerCase()===v||a.en.toLowerCase()===v})[0];
 if(m){st.user={k:m.k,lat:m.lat,lng:m.lng};$('whereHint').textContent=T().youAre+': '+nameOf(m);renderList();renderMap()}
 else{$('whereHint').textContent=T().unknownArea}});
$('live').addEventListener('click',function(){
 var fail=function(){$('whereHint').textContent=T().liveFail};
 if(!navigator.geolocation){fail();return}
 try{navigator.geolocation.getCurrentPosition(function(p){st.user={k:null,lat:p.coords.latitude,lng:p.coords.longitude};$('where').value=T().youAre;$('whereHint').textContent='';renderList();renderMap()},fail,{timeout:6000})}catch(e){fail()}});
$('brand').addEventListener('click',playSplash);

function toast(msg){var el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},3200)}
function openSheet(areaKey){fillTypes();if(areaKey&&AREA[areaKey])$('fArea').value=areaKey;$('sheet').hidden=false;$('fName').focus()}
$('fab').addEventListener('click',function(){openSheet('')});
$('fCancel').addEventListener('click',function(){$('sheet').hidden=true});
$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))$('sheet').hidden=true});
$('addForm').addEventListener('submit',function(e){
 e.preventDefault();
 var nm=$('fName').value.trim(),ad=$('fAddr').value.trim(),lk=$('fLink').value.trim();if(!nm||!ad)return;
 if(lk&&lk.indexOf('https://')!==0){toast(T().badLink);return}
 var item={id:'u'+Date.now(),f:st.fest,bn:nm,en:nm,a:$('fArea').value,t:$('fType').value,addr:ad,pending:true};
 if(lk)item.gm=lk;
 st.extra.push(item);try{localStorage.setItem('pkd_extra2',JSON.stringify(st.extra))}catch(x){}
 $('addForm').reset();$('sheet').hidden=true;st.q='';$('search').value='';
 if(item.f==='kali'){st.kind='all';st.selArea=item.a;st.sel=item.id}else{st.sel=item.id}
 renderAll();toast(T().added)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('sheet').hidden=true;if(!$('splash').hidden)closeSplash()}});

renderAll();playSplash();
})();
</script>
