<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>পূজা কোথায় দেখব</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap">
<style>
/* Layout concept: one night-lit page. Header with language slider and three tabs (Durga, Kali, 2026 calendar), a countdown, then list and schematic map side by side on wide screens. The calendar is a vertical timeline with a lit line for what is complete. */
:root{
  --bg:#0D0E1E; --surface:#161830; --surface2:#1D2040; --line:#2C2F52;
  --fg:#F7ECD6; --muted:#A8A6BF; --accent:#F4A83D; --accent-ink:#1A1204;
  --sindoor:#E0452E; --glow:rgba(244,168,61,.38); --river:#232C58; --focus:#FFD68A;
  --stripe:linear-gradient(90deg,transparent,var(--accent),transparent);
  --font-display:'Tiro Bangla','Hind Siliguri',Georgia,serif;
  --font-body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-fest="durga"]{
  --bg:#FFFCF7; --surface:#FFFFFF; --surface2:#F8EFE3; --line:#EAD9C6;
  --fg:#2B1912; --muted:#7B6558; --accent:#C42B1E; --accent-ink:#FFFFFF;
  --sindoor:#C42B1E; --glow:rgba(196,43,30,.16); --river:#DDE8F0; --focus:#C42B1E;
  --stripe:linear-gradient(var(--sindoor) 0 4px,transparent 4px 6px,#C9A24A 6px 8px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .5s,color .5s;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stripe{height:8px;background:var(--stripe);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand svg{width:30px;height:34px;flex:none}
.brand b{font-family:var(--font-display);font-weight:400;font-size:1.55rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.lang{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;width:176px}
.lang .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--accent);border-radius:999px;transition:transform .3s}
.lang[data-lang="en"] .thumb{transform:translateX(100%)}
.lang button{position:relative;background:none;border:0;padding:5px 0;font-weight:600;font-size:.9rem;color:var(--muted);transition:color .3s}
.lang button[aria-pressed="true"]{color:var(--accent-ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 18px;font-weight:600}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* countdown */
.count{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;position:relative;overflow:hidden}
.count::before{content:"";position:absolute;inset:-40% auto auto -10%;width:60%;height:140%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.count>*{position:relative;min-width:0}
.big{font-family:var(--font-display);font-size:4.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .lbl{font-size:1.1rem;font-weight:600}
.count .sub{color:var(--muted);font-size:.92rem}
.diyas{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.diya{width:22px;height:25px}
.diya .flame{opacity:0;transform-origin:50% 100%;transform-box:fill-box}
.diya .bowl{fill:var(--line)}
.diya .wick{fill:var(--muted)}
.diya.lit .bowl{fill:#B5651D}
.diya.lit .flame{opacity:1;fill:var(--accent);animation:flick 1.6s ease-in-out infinite}
.diya.lit:nth-child(odd) .flame{animation-delay:-.7s}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.9,1.08)}70%{transform:scale(1.05,.94)}}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.days span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem;color:var(--muted)}

/* controls */
.controls{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.controls{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.inrow{display:flex;gap:8px;min-width:0}
.inp{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.inp::placeholder{color:var(--muted)}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:.82rem;color:var(--muted);min-height:1.3em}

/* kali kind chips */
.kinds{display:flex;flex-direction:column;gap:6px}
.kinds .row{display:flex;gap:8px;flex-wrap:wrap}
.pillbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600;font-size:.94rem}
.pillbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pillbtn small{opacity:.8;font-weight:500;margin-left:4px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .cnt{color:var(--muted);font-size:.92rem}
.viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewtoggle button{background:var(--surface);border:0;padding:6px 16px;font-weight:600}
.viewtoggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media(min-width:900px){.viewtoggle{display:none}}

/* main grid */
.main{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.mapcol{position:sticky;top:16px}}
@media(max-width:899px){.wrap[data-view="list"] .mapcol{display:none}.wrap[data-view="map"] .listcol{display:none}}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sec{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.05rem;color:var(--accent);margin-top:8px}
.sec::after{content:"";flex:1;border-top:1px dashed var(--line)}
.sec:first-child{margin-top:0}
.card{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 6px 22px var(--glow)}
.c-name{display:block;font-family:var(--font-display);font-size:1.18rem;line-height:1.25}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:.86rem;margin-top:2px}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.78rem}
.chip.warn{border-color:var(--sindoor);color:var(--sindoor)}
.c-dist{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap;text-align:right}
.c-dist small{display:block;color:var(--muted);font-weight:400;font-size:.72rem}
.detail{margin:-4px 0 0;padding:12px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.detail a{color:var(--accent);font-weight:600}
.near-h{font-weight:600;font-size:.84rem;color:var(--muted)}
.near{display:flex;flex-wrap:wrap;gap:6px}
.near button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.86rem}
.near button b{color:var(--accent);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapnote{padding:8px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.pin{cursor:pointer}
.pin:focus-visible{outline:none}
.pin:focus-visible circle.core{stroke:var(--focus);stroke-width:3}
.ghost{fill:var(--muted);opacity:.55;font-size:11px;text-anchor:middle}
.plabel{fill:var(--fg);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}

/* calendar timeline */
.calhead{display:flex;flex-direction:column;gap:6px}
.calhead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.calhead .sum{color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:10px}
.tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;border-left:2px dashed var(--line)}
.tl li{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-left:34px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tl .dot{position:absolute;left:-30px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.tl li.done{opacity:.72}
.tl li.done .dot{background:var(--muted);border-color:var(--muted)}
.tl li.live .dot,.tl li.next .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--glow)}
.tl li.next,.tl li.live{border-color:var(--accent);box-shadow:0 6px 22px var(--glow)}
.tl-name{font-family:var(--font-display);font-size:1.15rem;line-height:1.3}
.tl-date{color:var(--muted);font-size:.88rem}
.status{white-space:nowrap;font-size:.84rem;font-weight:700;border-radius:999px;padding:2px 12px;border:1px solid var(--line);color:var(--muted)}
.tl li.done .status::before{content:"✓ "}
.tl li.live .status,.tl li.next .status{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tl li.left .status{color:var(--fg)}
.tag-next{display:inline-block;margin-left:8px;font-family:var(--font-body);font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.calnote{color:var(--muted);font-size:.84rem}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.84rem;border-top:1px solid var(--line);padding-top:14px}

/* add sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0}
.sheet[hidden]{display:none}
.sheet form{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
@media(min-width:700px){.sheet{align-items:center}.sheet form{border-radius:18px}}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 24px var(--glow),0 2px 8px rgba(0,0,0,.35)}
.fab[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:40;max-width:90%}
.toast[hidden]{display:none}

/* opening splash */
.splash{position:fixed;inset:0;z-index:100;background:#080914;color:#F7ECD6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .6s}
.splash[hidden]{display:none}
.splash.out{opacity:0;pointer-events:none}
.splash .glow{position:absolute;width:90vmin;height:90vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(244,168,61,.5),transparent);transform:scale(.1);opacity:0;animation:bloom 2.4s .5s ease-out forwards}
.splash.durga .glow{background:radial-gradient(closest-side,rgba(224,69,46,.35),transparent)}
@keyframes bloom{to{transform:scale(1);opacity:1}}
.splash svg{position:relative;width:110px;height:auto}
.splash .sflame{transform-origin:50% 100%;transform-box:fill-box;transform:scale(0);animation:ignite .9s 1.1s ease-out forwards,flick 1.6s 2s ease-in-out infinite}
@keyframes ignite{to{transform:scale(1)}}
.splash h1{position:relative;margin:0;font-family:var(--font-display);font-weight:400;font-size:2.2rem;opacity:0;animation:rise .8s 1.5s ease-out forwards}
.splash p{position:relative;margin:0;color:#B9B6CE;opacity:0;animation:rise .8s 1.9s ease-out forwards}
.splash .skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:.82rem;color:#7F7C99}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.smoke circle{fill:#d9d4e6;opacity:0;animation:smoke 3.2s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:.9s}.smoke circle:nth-child(3){animation-delay:1.8s}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:.5}100%{opacity:0;transform:translate(10px,-70px) scale(2.4)}}
.ember{animation:ember 1.4s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.7}50%{opacity:1}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .splash .sflame{transform:scale(1)}
  .splash .glow{transform:scale(1);opacity:1}
  .splash h1,.splash p{opacity:1}
}
</style>

<div class="splash" id="splash" hidden role="presentation"></div>

<div class="stripe"></div>
<div class="wrap" id="wrap" data-view="list">
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Replay opening">
      <svg viewBox="0 0 36 40" aria-hidden="true"><path d="M18 3C23 10 24 14.5 18 21C12 14.5 13 10 18 3Z" fill="var(--accent)"/><rect x="17" y="19" width="2" height="6" rx="1" fill="var(--muted)"/><path d="M2 24Q5 36 18 36Q31 36 34 24Q26 28 18 28Q10 28 2 24Z" fill="#B5651D"/></svg>
      <span><b id="appName"></b><small id="appTag"></small></span>
    </button>
    <div class="lang" id="lang" data-lang="bn" role="group" aria-label="Language">
      <span class="thumb"></span>
      <button type="button" data-l="bn" aria-pressed="true">বাংলা</button>
      <button type="button" data-l="en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="Festival">
    <button type="button" data-f="durga"></button>
    <button type="button" data-f="kali"></button>
    <button type="button" data-f="cal"></button>
  </div>

  <section class="count" id="count" aria-live="polite"></section>

  <div id="pujaArea" class="stack">
    <section class="controls">
      <div class="field">
        <label for="search" id="lSearch"></label>
        <input class="inp" id="search" type="search" autocomplete="off">
      </div>
      <div class="field">
        <label for="where" id="lWhere"></label>
        <div class="inrow">
          <input class="inp" id="where" list="areaList" autocomplete="off">
          <button class="btn" id="live" type="button"></button>
        </div>
        <datalist id="areaList"></datalist>
        <div class="hint" id="whereHint"></div>
      </div>
    </section>

    <div class="kinds" id="kinds" hidden>
      <div class="row" id="kindRow"></div>
      <div class="hint" id="kindHint"></div>
    </div>

    <div class="bar">
      <span class="cnt" id="cnt"></span>
      <div class="viewtoggle" id="viewtoggle">
        <button type="button" data-v="list" aria-pressed="true"></button>
        <button type="button" data-v="map" aria-pressed="false"></button>
      </div>
    </div>

    <div class="main">
      <section class="listcol"><ul class="list" id="list"></ul></section>
      <section class="mapcol">
        <div class="mapbox">
          <div id="map"></div>
          <div class="mapnote" id="mapNote"></div>
        </div>
      </section>
    </div>
  </div>

  <section id="calArea" class="stack" hidden>
    <div class="calhead"><h2 id="calTitle"></h2><div class="sum" id="calSum"></div></div>
    <div class="kinds"><div class="row" id="calRow"></div></div>
    <ol class="tl" id="tl"></ol>
    <div class="calnote" id="calNote"></div>
  </section>

  <footer class="foot"><span id="demoNote"></span></footer>
</div>

<button class="fab" id="fab" type="button"></button>

<div class="sheet" id="sheet" hidden>
  <form id="addForm">
    <h2 id="fTitle"></h2>
    <div class="field"><label for="fName" id="lfName"></label><input class="inp" id="fName" required></div>
    <div class="field"><label for="fArea" id="lfArea"></label><select class="inp" id="fArea"></select></div>
    <div class="field"><label for="fAddr" id="lfAddr"></label><input class="inp" id="fAddr" required></div>
    <div class="field"><label for="fType" id="lfType"></label><select class="inp" id="fType"></select></div>
    <div class="hint" id="fNote"></div>
    <div class="row">
      <button class="btn" type="button" id="fCancel"></button>
      <button class="btn primary" type="submit" id="fSubmit"></button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

  return (p.bn+' '+p.en+' '+a.bn+' '+a.en).toLowerCase().indexOf(q)>-1});
 if(st.user){arr=arr.map(function(p){return{p:p,d:dist(p)}}).sort(function(x,y){return x.d-y.d}).map(function(o){return o.p})}

var splashTimer=null;

/* ---------- render ---------- */
function diyaSvg(lit){return '<svg class="diya'+(lit?' lit':'')+'" viewBox="0 0 36 40" aria-hidden="true"><path class="flame" d="M18 3C23 10 24 14.5 18 21C12 14.5 13 10 18 3Z"/><rect class="wick" x="17" y="19" width="2" height="6" rx="1"/><path class="bowl" d="M2 24Q5 36 18 36Q31 36 34 24Q26 28 18 28Q10 28 2 24Z"/></svg>'}
function renderCount(){

 }
 c.innerHTML=html}

function cardHTML(p){
 var t=T(),a=AREA[p.a],d=dist(p),on=p.id===st.sel,o='';
 o+='<li><button type="button" class="card" data-id="'+esc(p.id)+'" aria-pressed="'+on+'"><span><span class="c-name">'+esc(nameOf(p))+'</span><span class="c-meta"><span>'+esc(nameOf(a))+'</span><span class="chip">'+t.types[p.t]+'</span>'+(p.pending?'<span class="chip warn">'+t.pending+'</span>':'')+'</span></span>'+
  (d!==null?'<span class="c-dist">'+km(d)+' '+t.km+'<small>'+t.away+'</small></span>':'')+'</button>';
 if(on){
  o+='<div class="detail"><span>'+esc(nameOf(a))+(p.addr?' · '+esc(p.addr):'')+'</span><span>'+t.approx+'</span>';
  if(p.f==='kali'){
   var nb=all().filter(function(x){return x.f==='kali'&&kindOf(x)==='mandap'&&x.id!==p.id}).map(function(x){var b=AREA[x.a];return{x:x,d:haversine(a.lat,a.lng,b.lat,b.lng)}}).filter(function(r){return r.d<=2.5}).sort(function(r,s){return r.d-s.d}).slice(0,4);
   if(nb.length){o+='<div class="near-h">'+t.nearby+'</div><div class="near">'+nb.map(function(r){return '<button type="button" data-near="'+esc(r.x.id)+'">'+esc(nameOf(AREA[r.x.a]))+'<b>'+km(r.d)+' '+t.km+'</b></button>'}).join('')+'</div>'}
  }
  o+='<a href="https://www.google.com/maps/search/?api=1&query='+a.lat+','+a.lng+'" target="_blank" rel="noopener">'+t.dir+'</a></div>'}
 return o+'</li>'}

function renderList(){
 var t=T(),arr=visible(),ul=$('list'),out='';
 $('cnt').textContent=t.count(n(arr.length))+(st.user&&arr.length?' · '+t.near:'');
 if(!arr.length){ul.innerHTML='<li class="empty">'+t.none+'</li>';return}

function renderKinds(){

var W=400,H=520,LAT0=23.885,LAT1=23.690,LNG0=90.345,LNG1=90.445;
function px(lng){return (lng-LNG0)/(LNG1-LNG0)*W}
function py(lat){return (LAT0-lat)/(LAT0-LAT1)*H}
function renderMap(){
 var t=T(),arr=visible(),s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t.map)+'">';
 s+='<rect width="'+W+'" height="'+H+'" fill="var(--surface2)"/>';
 for(var g=1;g<5;g++){s+='<line x1="'+g*80+'" y1="0" x2="'+g*80+'" y2="'+H+'" stroke="var(--line)" stroke-width="1" opacity=".5"/>'}
 for(var g2=1;g2<7;g2++){s+='<line x1="0" y1="'+g2*80+'" x2="'+W+'" y2="'+g2*80+'" stroke="var(--line)" stroke-width="1" opacity=".5"/>'}
 s+='<path d="M-10 470C70 492 150 500 240 520L240 540L-10 540Z" fill="var(--river)" opacity=".9"/>';
 ['uttara','gulshan','dhanmondi','mirpur','motijheel','lalbagh'].forEach(function(k){var a=AREA[k];s+='<text class="ghost" x="'+px(a.lng)+'" y="'+(py(a.lat)+4)+'">'+esc(nameOf(a))+'</text>'});
 var sel=null;arr.forEach(function(p){if(p.id===st.sel)sel=p});
 if(st.user&&sel){var a=AREA[sel.a],x1=px(st.user.lng),y1=py(st.user.lat),x2=px(a.lng),y2=py(a.lat);
  s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>';
  s+='<text class="plabel" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-6)+'" text-anchor="middle">'+km(dist(sel))+' '+t.km+'</text>'}
 arr.forEach(function(p){if(p.id===st.sel)return;var a=AREA[p.a],x=px(a.lng),y=py(a.lat);
  s+='<g class="pin" tabindex="0" role="button" data-id="'+esc(p.id)+'" aria-label="'+esc(nameOf(p))+'"><circle cx="'+x+'" cy="'+y+'" r="13" fill="var(--glow)"/><circle class="core" cx="'+x+'" cy="'+y+'" r="6.5" fill="var(--accent)" stroke="var(--surface2)" stroke-width="2"/></g>'});
 if(sel){var a2=AREA[sel.a],xs=px(a2.lng),ys=py(a2.lat),anc=xs>W*0.62?'end':(xs<W*0.2?'start':'middle'),lx=anc==='end'?xs+4:(anc==='start'?xs-4:xs);
  s+='<g class="pin" tabindex="0" role="button" data-id="'+esc(sel.id)+'" aria-label="'+esc(nameOf(sel))+'"><circle cx="'+xs+'" cy="'+ys+'" r="20" fill="var(--glow)"/><circle class="core" cx="'+xs+'" cy="'+ys+'" r="9.5" fill="var(--accent)" stroke="var(--fg)" stroke-width="2.5"/></g>';
  s+='<text class="plabel" x="'+lx+'" y="'+(ys-17)+'" text-anchor="'+anc+'">'+esc(nameOf(sel))+'</text>'}
 if(st.user){var xu=px(st.user.lng),yu=py(st.user.lat);
  s+='<g><circle cx="'+xu+'" cy="'+yu+'" r="10" fill="none" stroke="var(--fg)" stroke-width="2" opacity=".6"/><circle cx="'+xu+'" cy="'+yu+'" r="5" fill="var(--fg)"/><text class="plabel" x="'+(xu+12)+'" y="'+(yu+4)+'">'+t.you+'</text></g>'}
 s+='</svg>';
 $('map').innerHTML=s;$('mapNote').textContent=t.mapNote}

function calStatus(c){

 if(de<0)return{k:'done'};
 if(ds<=0&&de>=0)return{k:'live'};
 return{k:'left',d:ds}}

 var t=T(),items=CAL.map(function(c){return{c:c,s:calStatus(c)}});
 var nd=items.filter(function(i){return i.s.k==='done'}).length,nl=items.length-nd;
 var nextIdx=-1;items.forEach(function(i,ix){if(nextIdx<0&&i.s.k==='left')nextIdx=ix});
 $('calTitle').textContent=t.calTitle;$('calSum').textContent=t.sum(n(nd),n(nl));

 $('calRow').innerHTML=defs.map(function(d){return '<button type="button" class="pillbtn" data-cf="'+d[0]+'" aria-pressed="'+(st.calf===d[0])+'">'+d[1]+'<small>'+n(d[2])+'</small></button>'}).join('');
 var out='';
 items.forEach(function(i,ix){
  var k=i.s.k;if(st.calf==='done'&&k!=='done')return;if(st.calf==='left'&&k==='done')return;

  out+='<li class="'+cls+'"><span class="dot"></span><div><div class="tl-name">'+esc(nameOf(i.c))+(ix===nextIdx?'<span class="tag-next">'+t.next.toUpperCase()+'</span>':'')+'</div><div class="tl-date">'+fmtRange(i.c.s,i.c.e)+'</div></div><span class="status">'+label+'</span></li>'});
 $('tl').innerHTML=out||'<li class="empty">'+t.none+'</li>';
